[workspace]
resolver = "2"
members = [
    "crates/labdrop-core",
    "crates/labdrop",
    "crates/labdrop-bootstrapper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LabDrop Contributors"]
repository = "https://github.com/4mrco/labdrop"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
walkdir = "2.5"
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
