name: Build, Test & Release LabDrop

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deduplicate-release-push:
    name: Check Duplicate Release Push
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip branch run when commit already has a v* release tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            sleep 3
            if git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" 'refs/tags/v*' \
              | grep -Eq "^${GITHUB_SHA}[[:space:]]+refs/tags/v"; then
              echo "Commit ${GITHUB_SHA} is already tagged with a v* release tag; letting the tag workflow run handle it."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  test-and-build-linux:
    name: Linux x86-64 (Build & Test)
    needs: [deduplicate-release-push]
    if: needs.deduplicate-release-push.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Samba and MUSL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools samba smbclient
          # Ubuntu 24.04+/26.04 restricts unprivileged user namespaces via AppArmor by default;
          # enable them on the CI runner so the rootless Samba E2E test runs end-to-end.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Run Automated Test Suite
        run: cargo test --workspace --locked

      - name: Build Static Linux Release Executables
        run: cargo build --workspace --release --target x86_64-unknown-linux-musl --locked

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labdrop-linux-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/labdrop
            target/x86_64-unknown-linux-musl/release/labdrop-bootstrapper

  test-and-build-windows:
    name: Windows 10/11 x86-64 (Build & Test)
    needs: [deduplicate-release-push]
    if: needs.deduplicate-release-push.outputs.should_run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Automated Test Suite on Windows
        run: cargo test --workspace --locked

      - name: Build Native Windows Release Executables
        run: |
          cargo build --workspace --release --target x86_64-pc-windows-msvc --locked
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\labdrop.exe dist-win\LabDrop.exe
          Copy-Item target\x86_64-pc-windows-msvc\release\labdrop-bootstrapper.exe dist-win\labdrop-bootstrapper.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labdrop-windows-x86_64
          path: |
            dist-win/LabDrop.exe
            dist-win/labdrop-bootstrapper.exe

  package-and-verify-usb:
    name: Package & Verify Cross-Platform USB Bundle
    needs: [deduplicate-release-push, test-and-build-linux, test-and-build-windows]
    if: needs.deduplicate-release-push.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: labdrop-linux-x86_64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: labdrop-windows-x86_64
          path: dist

      - name: Generate SHA256SUMS.txt and Verify Bootstrapper
        run: |
          chmod +x dist/labdrop dist/labdrop-bootstrapper
          cd dist
          tar --mode='0755' -czf labdrop-bootstrapper-linux-x86_64.tar.gz labdrop-bootstrapper
          sha256sum labdrop LabDrop.exe labdrop-bootstrapper labdrop-bootstrapper.exe labdrop-bootstrapper-linux-x86_64.tar.gz > SHA256SUMS.txt
          cd ..
          ./dist/labdrop-bootstrapper --dest ./usb_verified --source-dir ./dist
          test -f ./usb_verified/LabDrop/labdrop
          test -f ./usb_verified/LabDrop/LabDrop.exe
          test -f ./usb_verified/LabDrop/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/labdrop
            dist/LabDrop.exe
            dist/labdrop-bootstrapper
            dist/labdrop-bootstrapper.exe
            dist/labdrop-bootstrapper-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
